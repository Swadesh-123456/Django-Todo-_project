<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TaskFlow Pro{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    {% load static %}

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<!-- =========================
     PROFESSIONAL NAVBAR
========================= -->

<nav class="navbar navbar-expand-lg shadow-sm">

    <div class="container-fluid px-4">

        <!-- Brand -->
        <a class="navbar-brand fw-bold d-flex align-items-center"
           href="{% url 'home' %}">

            <span class="brand-icon">
                <i class="bi bi-check2-square"></i>
            </span>

            <span>TaskFlow Pro</span>

        </a>


        <!-- Right Side -->
        <div class="ms-auto d-flex align-items-center gap-2">

            {% if user.is_authenticated %}

                <!-- Theme -->
                <button
                    id="theme-toggle"
                    type="button"
                    class="theme-toggle"
                    title="Toggle Dark Mode"
                    aria-label="Toggle Dark Mode">

                    <i id="theme-icon"
                       class="bi bi-moon-fill"></i>

                </button>


                <!-- User -->
                <a href="{% url 'profile' %}"
                   class="navbar-user">

                    <i class="bi bi-person-circle"></i>

                    <span>
                        {{ user.username }}
                    </span>

                </a>


                <!-- Dashboard -->
                <a href="{% url 'dashboard' %}"
                   class="btn btn-primary btn-sm nav-btn">

                    <i class="bi bi-speedometer2"></i>
                    Dashboard

                </a>


                <!-- Profile -->
                <a href="{% url 'profile' %}"
                   class="btn btn-outline-light btn-sm nav-btn">

                    <i class="bi bi-person"></i>
                    Profile

                </a>


                <!-- Logout -->
                <form method="POST"
                      action="{% url 'logout' %}"
                      class="logout-form">

                    {% csrf_token %}

                    <button type="submit"
                            class="btn btn-danger btn-sm nav-btn">

                        <i class="bi bi-box-arrow-right"></i>
                        Logout

                    </button>

                </form>

            {% endif %}

        </div>

    </div>

</nav>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="main-content">

    <div class="container py-4">

        {% block content %}
        {% endblock %}

    </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="container text-center">

        <small>
            © 2026 TaskFlow Pro
            <span class="footer-separator">|</span>
            Built with ❤️ using Django & MySQL
        </small>

    </div>

</footer>


<!-- =====================================================
     THEME JAVASCRIPT
===================================================== -->

<script>
document.addEventListener("DOMContentLoaded", function () {

    const themeToggle = document.getElementById("theme-toggle");

    if (!themeToggle) return;

    function applyTheme(theme) {

        if (theme === "dark") {
            document.body.classList.add("dark-mode");
            themeToggle.innerHTML = '<i class="bi bi-sun-fill"></i>';
            themeToggle.title = "Switch to Light Mode";
        } else {
            document.body.classList.remove("dark-mode");
            themeToggle.innerHTML = '<i class="bi bi-moon-fill"></i>';
            themeToggle.title = "Switch to Dark Mode";
        }
    }

    // Load saved theme
    const savedTheme = localStorage.getItem("theme") || "light";

    applyTheme(savedTheme);

    // Toggle theme
    themeToggle.addEventListener("click", function () {

        const isDark =
            document.body.classList.contains("dark-mode");

        const newTheme = isDark ? "light" : "dark";

        localStorage.setItem("theme", newTheme);

        applyTheme(newTheme);
    });

});
</script>




<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
