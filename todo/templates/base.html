<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskFlow Pro{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-check2-square"></i> TaskFlow Pro
        </a>

        <div class="ms-auto d-flex align-items-center">

            <button id="theme-toggle" class="btn btn-outline-light btn-sm me-3">
                <i class="bi bi-moon-fill"></i>
            </button>

            {% if user.is_authenticated %}

            <span class="text-white me-3">
                <i class="bi bi-person-circle"></i>
                {{ user.username }}
            </span>

            <a href="{% url 'dashboard' %}" class="btn btn-primary btn-sm me-2">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>

            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>

            {% endif %}

        </div>

    </div>
</nav>

    <!-- Page Content -->
    <div class="container py-4">
        {% block content %}
        {% endblock %}
    </div>


<footer class="text-center py-3 mt-5 border-top">
    <small class="text-muted">
        © 2026 TaskFlow Pro | Built with ❤️ using Django & MySQL
    </small>
</footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const btn = document.getElementById("theme-toggle");

    if (btn) {
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            btn.innerHTML = '<i class="bi bi-sun-fill"></i>';
        }

        btn.addEventListener("click", function () {
            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
                btn.innerHTML = '<i class="bi bi-sun-fill"></i>';
            } else {
                localStorage.setItem("theme", "light");
                btn.innerHTML = '<i class="bi bi-moon-fill"></i>';
            }
        });
    }
});
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
