<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}TaskFlow Pro{% endblock %}
    </title>

    <!-- =====================================================
         BOOTSTRAP 5
    ====================================================== -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    {% load static %}

    <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>


<body>

<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="navbar navbar-expand-lg shadow-sm">

    <div class="container-fluid px-4">

        <!-- =================================================
             BRAND
        ================================================== -->

        <a
            class="navbar-brand fw-bold d-flex align-items-center"
            href="{% url 'home' %}"
        >

            <span class="brand-icon">
                <i class="bi bi-check2-square"></i>
            </span>

            <span class="brand-text">
                TaskFlow Pro
            </span>

        </a>


        <!-- =================================================
             MOBILE MENU BUTTON
        ================================================== -->

        <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >

            <i class="bi bi-list"></i>

        </button>


        <!-- =================================================
             NAVBAR COLLAPSE
        ================================================== -->

        <div
            class="collapse navbar-collapse"
            id="mainNavbar"
        >

            {% if user.is_authenticated %}

            <div class="navbar-actions">


                <!-- =========================================
                     THEME BUTTON
                ========================================== -->

                <button
                    id="theme-toggle"
                    type="button"
                    class="theme-toggle"
                    title="Toggle Dark Mode"
                    aria-label="Toggle Dark Mode"
                >

                    <i
                        id="theme-icon"
                        class="bi bi-moon-fill"
                    ></i>

                </button>


                <!-- =========================================
                     USERNAME
                ========================================== -->

                <a
                    href="{% url 'profile' %}"
                    class="navbar-user"
                    title="Profile"
                >

                    <i class="bi bi-person-circle"></i>

                    <span>
                        {{ user.username }}
                    </span>

                </a>


                <!-- =========================================
                     DASHBOARD
                ========================================== -->

                <a
                    href="{% url 'dashboard' %}"
                    class="btn btn-primary btn-sm nav-btn"
                >

                    <i class="bi bi-speedometer2"></i>

                    <span>
                        Dashboard
                    </span>

                </a>


                <!-- =========================================
                     PROFILE
                ========================================== -->

                <a
                    href="{% url 'profile' %}"
                    class="btn btn-outline-light btn-sm nav-btn"
                >

                    <i class="bi bi-person"></i>

                    <span>
                        Profile
                    </span>

                </a>


                <!-- =========================================
                     LOGOUT
                ========================================== -->

                <form
                    method="POST"
                    action="{% url 'logout' %}"
                    class="logout-form"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger btn-sm nav-btn"
                    >

                        <i class="bi bi-box-arrow-right"></i>

                        <span>
                            Logout
                        </span>

                    </button>

                </form>

            </div>

            {% else %}

            <!-- =============================================
                 LOGIN
            ============================================== -->

            <div class="navbar-actions">

                <a
                    href="{% url 'login' %}"
                    class="btn btn-primary btn-sm nav-btn"
                >

                    <i class="bi bi-box-arrow-in-right"></i>

                    <span>
                        Login
                    </span>

                </a>

            </div>

            {% endif %}

        </div>

    </div>

</nav>


<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<main class="main-content">

    <div class="container py-4">

        {% block content %}
        {% endblock %}

    </div>

</main>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

    <div class="container text-center">

        <small>

            © 2026 TaskFlow Pro

            <span class="footer-separator">
                |
            </span>

            Built with ❤️ using Django & PostgreSQL

        </small>

    </div>

</footer>


<!-- =========================================================
     THEME JAVASCRIPT
========================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const themeToggle =
        document.getElementById("theme-toggle");

    const themeIcon =
        document.getElementById("theme-icon");


    /* =====================================================
       STOP IF THEME BUTTON DOES NOT EXIST
    ===================================================== */

    if (!themeToggle) {
        return;
    }


    /* =====================================================
       APPLY THEME
    ===================================================== */

    function applyTheme(theme) {

        if (theme === "dark") {

            document.body.classList.add("dark-mode");

            if (themeIcon) {
                themeIcon.className =
                    "bi bi-sun-fill";
            }

            themeToggle.title =
                "Switch to Light Mode";

            themeToggle.setAttribute(
                "aria-label",
                "Switch to Light Mode"
            );

        } else {

            document.body.classList.remove(
                "dark-mode"
            );

            if (themeIcon) {
                themeIcon.className =
                    "bi bi-moon-fill";
            }

            themeToggle.title =
                "Switch to Dark Mode";

            themeToggle.setAttribute(
                "aria-label",
                "Switch to Dark Mode"
            );
        }
    }


    /* =====================================================
       LOAD SAVED THEME
    ===================================================== */

    const savedTheme =
        localStorage.getItem("theme") || "light";

    applyTheme(savedTheme);


    /* =====================================================
       THEME TOGGLE
    ===================================================== */

    themeToggle.addEventListener(
        "click",
        function () {

            const isDark =
                document.body.classList.contains(
                    "dark-mode"
                );

            const newTheme =
                isDark ? "light" : "dark";

            localStorage.setItem(
                "theme",
                newTheme
            );

            applyTheme(newTheme);

        }
    );

});

</script>


<!-- =========================================================
     BOOTSTRAP JAVASCRIPT
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>
</html>
