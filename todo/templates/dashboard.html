<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">
        📊 Todo Dashboard
    </h2>

    <div class="row g-3">

        <div class="col-md-4">
            <div class="card bg-primary text-white text-center p-3 shadow">
                <h3>{{ total }}</h3>
                <p class="mb-0">Total Tasks</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-success text-white text-center p-3 shadow">
                <h3>{{ completed }}</h3>
                <p class="mb-0">Completed</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-warning text-dark text-center p-3 shadow">
                <h3>{{ pending }}</h3>
                <p class="mb-0">Pending</p>
            </div>
        </div>

    </div>

    <!-- Progress Bar -->
    <div class="mt-5">

        <h5 class="mb-3">Task Progress</h5>

        <div class="progress" style="height:25px;">

            <div
                class="progress-bar bg-success progress-bar-striped progress-bar-animated"
                role="progressbar"
                style="width: {{ completion_rate }}%;"
                aria-valuenow="{{ completion_rate }}"
                aria-valuemin="0"
                aria-valuemax="100">

                {{ completion_rate }}%

            </div>

        </div>

    </div>

    <!-- Charts -->
    <div class="row mt-5">

        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4 p-3">

                <h5 class="text-center">
                    📊 Task Status
                </h5>

                <canvas id="statusChart"></canvas>

            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4 p-3">

                <h5 class="text-center">
                    📈 Priority Chart
                </h5>

                <canvas id="priorityChart"></canvas>

            </div>
        </div>

    </div>

    <div class="mt-4 text-center">

        <a href="/" class="btn btn-primary">
            ⬅ Back to Home
        </a>

    </div>

</div>

<script>
const statusChart = document.getElementById("statusChart");

new Chart(statusChart, {
    type: "doughnut",
    data: {
        labels: ["Todo", "In Progress", "Completed"],
        datasets: [{
            data: [
                {{ todo_count }},
                {{ in_progress_count }},
                {{ completed_status_count }}
            ]
        }]
    }
});

const priorityChart = document.getElementById("priorityChart");

new Chart(priorityChart, {
    type: "bar",
    data: {
        labels: ["High", "Medium", "Low"],
        datasets: [{
            label: "Priority",
            data: [
                {{ high_priority }},
                {{ medium_priority }},
                {{ low_priority }}
            ]
        }]
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
