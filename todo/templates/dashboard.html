<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo Dashboard</title>

    <!-- Bootstrap 5.3.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* ==============================
           PAGE SCROLL FIX
        ============================== */

        html,
        body {
            min-height: 100%;
            height: auto;
            overflow-y: auto !important;
            overflow-x: hidden;
        }

        body {
            background: #f8f9fa;
        }

        /* ==============================
           DASHBOARD
        ============================== */

        .dashboard-container {
            padding-top: 30px;
            padding-bottom: 50px;
        }

        /* ==============================
           STAT CARDS
        ============================== */

        .stat-card {
            border: none;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15) !important;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
        }

        /* ==============================
           CHART CARDS
        ============================== */

        .chart-card {
            border: none;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 320px;
        }

        /* ==============================
           PROGRESS
        ============================== */

        .progress {
            border-radius: 15px;
            overflow: hidden;
        }

        .progress-bar {
            font-weight: 600;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 768px) {

            .dashboard-container {
                padding-top: 20px;
                padding-bottom: 40px;
            }

            .chart-container {
                height: 280px;
            }

            .stat-number {
                font-size: 26px;
            }
        }
    </style>
</head>


<body>

<div class="container dashboard-container">

    <!-- ==============================
         TITLE
    ============================== -->

    <h2 class="text-center mb-4 fw-bold">
        📊 Todo Dashboard
    </h2>


    <!-- ==============================
         STAT CARDS
    ============================== -->

    <div class="row g-3">

        <!-- Total -->
        <div class="col-12 col-md-4">

            <div class="card stat-card bg-primary text-white text-center p-4 shadow">

                <h3 class="stat-number mb-1">
                    {{ total }}
                </h3>

                <p class="mb-0">
                    Total Tasks
                </p>

            </div>

        </div>


        <!-- Completed -->
        <div class="col-12 col-md-4">

            <div class="card stat-card bg-success text-white text-center p-4 shadow">

                <h3 class="stat-number mb-1">
                    {{ completed }}
                </h3>

                <p class="mb-0">
                    Completed
                </p>

            </div>

        </div>


        <!-- Pending -->
        <div class="col-12 col-md-4">

            <div class="card stat-card bg-warning text-dark text-center p-4 shadow">

                <h3 class="stat-number mb-1">
                    {{ pending }}
                </h3>

                <p class="mb-0">
                    Pending
                </p>

            </div>

        </div>

    </div>


    <!-- ==============================
         PROGRESS
    ============================== -->

    <div class="mt-5">

        <div class="d-flex justify-content-between align-items-center mb-2">

            <h5 class="mb-0 fw-bold">
                Task Progress
            </h5>

            <span class="fw-bold">
                {{ completion_rate }}%
            </span>

        </div>


        <div
            class="progress"
            style="height: 25px;"
        >

            <div
                class="progress-bar bg-success progress-bar-striped progress-bar-animated"
                role="progressbar"
                style="width: {{ completion_rate }}%;"
                aria-valuenow="{{ completion_rate }}"
                aria-valuemin="0"
                aria-valuemax="100"
            >
                {{ completion_rate }}%
            </div>

        </div>

    </div>


    <!-- ==============================
         CHARTS
    ============================== -->

    <div class="row g-4 mt-4">


        <!-- STATUS CHART -->

        <div class="col-12 col-lg-6">

            <div class="card chart-card p-4 h-100">

                <h5 class="text-center fw-bold mb-4">
                    📊 Task Status
                </h5>

                <div class="chart-container">

                    <canvas id="statusChart"></canvas>

                </div>

            </div>

        </div>


        <!-- PRIORITY CHART -->

        <div class="col-12 col-lg-6">

            <div class="card chart-card p-4 h-100">

                <h5 class="text-center fw-bold mb-4">
                    📈 Priority Chart
                </h5>

                <div class="chart-container">

                    <canvas id="priorityChart"></canvas>

                </div>

            </div>

        </div>

    </div>


    <!-- ==============================
         BACK BUTTON
    ============================== -->

    <div class="text-center mt-5 mb-4">

        <a
            href="/"
            class="btn btn-primary px-4 py-2"
        >
            ⬅ Back to Home
        </a>

    </div>

</div>


<!-- ==============================
     CHART JAVASCRIPT
============================== -->

<script>

    /* =================================
       STATUS CHART
    ================================= */

    const statusCanvas =
        document.getElementById("statusChart");

    if (statusCanvas) {

        new Chart(statusCanvas, {

            type: "doughnut",

            data: {

                labels: [
                    "Todo",
                    "In Progress",
                    "Completed"
                ],

                datasets: [{

                    data: [
                        {{ todo_count|default:0 }},
                        {{ in_progress_count|default:0 }},
                        {{ completed_status_count|default:0 }}
                    ],

                    backgroundColor: [
                        "#0d6efd",
                        "#ffc107",
                        "#198754"
                    ],

                    borderWidth: 2

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {

                    legend: {
                        position: "bottom"
                    }

                }

            }

        });

    }


    /* =================================
       PRIORITY CHART
    ================================= */

    const priorityCanvas =
        document.getElementById("priorityChart");

    if (priorityCanvas) {

        new Chart(priorityCanvas, {

            type: "bar",

            data: {

                labels: [
                    "High",
                    "Medium",
                    "Low"
                ],

                datasets: [{

                    label: "Tasks",

                    data: [
                        {{ high_priority|default:0 }},
                        {{ medium_priority|default:0 }},
                        {{ low_priority|default:0 }}
                    ],

                    backgroundColor: [
                        "#dc3545",
                        "#ffc107",
                        "#198754"
                    ],

                    borderRadius: 8

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {
                            stepSize: 1
                        }

                    }

                },

                plugins: {

                    legend: {
                        display: false
                    }

                }

            }

        });

    }

</script>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>
</html>
