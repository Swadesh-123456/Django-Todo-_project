{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<div class="card shadow p-4">

<h2>My Profile</h2>

{% if profile.image %}
<img src="{{ profile.image.url }}"
width="120"
height="120"
class="rounded-circle mb-3">
{% endif %}


<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-primary">
Update Profile
</button>

</form>

</div>

</div>

{% endblock %}
